name: Deploy
on:
  workflow_dispatch:
  push:
    # Sequence of patterns matched against refs/heads
    branches:
      - dev

permissions:
  actions: read
  contents: read

jobs:
  dev:
    uses: ./.github/workflows/dev.yml
    secrets: inherit
  deploy:
    needs: dev
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: artifact
      - name: Publish scripts, configuration and subscriptions together
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import { readFile, writeFile } from "node:fs/promises";
          const names = ["request.dev.bundle.js", "response.dev.bundle.js", "DualSubs.Spotify.dev.sgmodule", "DualSubs.Spotify.dev.plugin", "DualSubs.Spotify.dev.snippet", "DualSubs.Spotify.dev.stoverride", "DualSubs.Spotify.dev.yaml", "DualSubs.Spotify.dev.boxjs.json", "DualSubs.Spotify.dev.PreferencePanes.json", "config.dev.bundle.js"];
          const files = Object.fromEntries(await Promise.all(names.map(async name => [name, { content: await readFile(`dist/${name}`, "utf8") }])));
          await writeFile("gist-update.json", JSON.stringify({ description: "🍿️ DualSubs: 🎵 Spotify β", files }));
          JS
          gh api --method PATCH gists/e60d056221d3d42ef6fa30c4e3ea8a51 --input gist-update.json --silent
